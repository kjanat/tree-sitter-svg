name: CI
on: { push: { branches: [master] }, pull_request: null, workflow_dispatch: null }
concurrency: { group: "ci-${{ github.sha }}", cancel-in-progress: true }
jobs:
  test:
    runs-on: ubuntu-latest
    env: { RUNNER_PM: bun }
    steps:
      - uses: actions/checkout@v6
      - uses: kjanat/runner@master
      - uses: actions/setup-node@v6
        with: { node-version-file: .node-version }
      - uses: oven-sh/setup-bun@v2
      - run: runner install --frozen --keep-going \
          typecheck \
          test:corpus \
          test:fuzz \
          parse:examples \
          test \
          test:bun \
          test:regex
